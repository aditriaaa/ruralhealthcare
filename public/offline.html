<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline - The Arcadian</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <section id="offline-ui">
      <h2>You are offline</h2>
      <p>The Arcadian is available offline for basic navigation and saved screens.</p>
      <p>Real-time features like matching, maps, and chat will resume when your connection returns.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </section>
  </main>
</body>
</html>
