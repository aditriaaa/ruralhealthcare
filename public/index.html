<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Arcadian</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="intro-page">
  <main>
    <div id="intro-screen" class="intro-screen">
      <div class="intro-content">
        <h1 class="intro-title" data-i18n="intro.title">The Arcadian</h1>
        <h2 class="intro-subtitle" data-i18n="intro.subtitle">Connect with healthcare providers instantly</h2>
        <p class="intro-description">
          <span data-i18n="intro.description">Quality care, anytime, anywhere. Find matches within 50 km and start a chat instantly.</span>
          <strong data-i18n="intro.description.strong">No waiting. No hassle.</strong>
        </p>
        <div class="intro-buttons">
          <a id="patientBtn" class="btn btn-primary" href="/patient.html" data-i18n="intro.patientBtn">I'm a Patient</a>
          <a id="providerBtn" class="btn btn-secondary" href="/provider-login.html" data-i18n="intro.providerBtn">I'm a Provider</a>
        </div>
        <div class="assistant-cta-wrap">
          <button type="button" class="assistant-launch-btn" data-open-offline-assistant data-i18n="assistant.chatCta">Chat with AI</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/offline-assistant.js"></script>
  <script src="/intro.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
