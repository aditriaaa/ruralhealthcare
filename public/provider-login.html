<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Provider Login - The Arcadian</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <div id="provider-login-ui">
      <h2 data-i18n="providerLogin.title">Provider Login</h2>
      <p data-i18n="providerLogin.subtitle">Use your provider username and password to continue.</p>
      <input id="providerLoginUsername" type="text" placeholder="Username" data-i18n-placeholder="providerLogin.username" autocomplete="username" />
      <input id="providerLoginPassword" type="password" placeholder="Password" data-i18n-placeholder="providerLogin.password" autocomplete="current-password" />
      <div class="auth-actions">
        <button id="providerLoginBtn" class="btn btn-primary" data-i18n="providerLogin.login">Log In</button>
        <button id="providerRegisterBtn" class="btn btn-secondary" data-i18n="providerLogin.createAccount">Create Account</button>
      </div>
      <div id="providerLoginStatus" aria-live="polite"></div>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script src="/offline-assistant.js"></script>
  <script src="/provider-login.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
